<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <defs>
    <linearGradient id="vhuGateGold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFD65C" />
      <stop offset="50%" stop-color="#EAA610" />
      <stop offset="100%" stop-color="#B87B00" />
    </linearGradient>

    <linearGradient id="vhuBookBlue" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#BEE4FA" />
      <stop offset="100%" stop-color="#80C8F8" />
    </linearGradient>

    <!-- Circular Path for Top Text ARC -->
    <path id="textArcTop" d="M 68,250 A 182,182 0 1,1 432,250" fill="none"/>
  </defs>

  <!-- Outer Double Circle Border -->
  <circle cx="250" cy="250" r="240" fill="#1C3F94" stroke="#FFFFFF" stroke-width="8"/>
  <circle cx="250" cy="250" r="226" fill="none" stroke="#FFFFFF" stroke-width="4"/>

  <!-- Top Text: TRƯỜNG ĐẠI HỌC VĂN HIẾN -->
  <text font-family="'Plus Jakarta Sans', 'Be Vietnam Pro', Arial, sans-serif" font-weight="900" font-size="33" fill="#FFFFFF" letter-spacing="3.5">
    <textPath href="#textArcTop" startOffset="50%" text-anchor="middle">
      TRƯỜNG ĐẠI HỌC VĂN HIẾN
    </textPath>
  </text>

  <!-- Khuê Văn Các Pavilion Gate (Gold Gradient) -->
  <!-- Top Roof Roof Top Dot -->
  <circle cx="250" cy="116" r="12" fill="url(#vhuGateGold)"/>
  
  <!-- Upper Roof Level 1 -->
  <path d="M 230,132 H 270 L 274,142 H 226 Z" fill="url(#vhuGateGold)"/>
  <path d="M 175,152 C 205,152 230,144 250,144 C 270,144 295,152 325,152 C 340,152 355,140 360,132 C 345,158 315,162 250,162 C 185,162 155,158 140,132 C 145,140 160,152 175,152 Z" fill="url(#vhuGateGold)"/>

  <!-- Middle Pavilion Window (Khuê Văn Các Sunburst Circle) -->
  <rect x="210" y="180" width="80" height="75" fill="url(#vhuGateGold)" rx="2"/>
  <rect x="220" y="190" width="60" height="55" fill="#1C3F94" rx="1"/>
  <circle cx="250" cy="217.5" r="15" fill="url(#vhuGateGold)"/>
  <!-- Sunburst Rays -->
  <path d="M 250,195 V 240 M 227.5,217.5 H 272.5 M 234,201.5 L 266,233.5 M 234,233.5 L 266,201.5" stroke="url(#vhuGateGold)" stroke-width="4"/>

  <!-- Lower Roof Level 2 -->
  <path d="M 142,176 C 180,176 220,164 250,164 C 280,164 320,176 358,176 C 372,176 382,166 386,158 C 375,188 335,188 250,188 C 165,188 125,188 114,158 C 118,166 128,176 142,176 Z" fill="url(#vhuGateGold)"/>

  <!-- 2 Support Pillars & Crossbar -->
  <rect x="162" y="248" width="176" height="18" fill="url(#vhuGateGold)"/>
  <rect x="172" y="266" width="24" height="88" fill="url(#vhuGateGold)"/>
  <rect x="304" y="266" width="24" height="88" fill="url(#vhuGateGold)"/>

  <!-- 1997 Text on Blue Center Base -->
  <text x="250" y="295" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="800" font-size="28" fill="#FFFFFF" text-anchor="middle" letter-spacing="2">1997</text>

  <!-- Open Book Wings Emblem (Sky Blue) -->
  <path d="M 250,370 C 205,330 115,325 80,332 L 80,345 C 115,338 205,342 250,385 C 295,342 385,338 420,345 L 420,332 C 385,325 295,330 250,370 Z" fill="url(#vhuBookBlue)"/>
  <path d="M 80,342 C 120,330 200,335 250,380 C 300,335 380,330 420,342 L 250,470 Z" fill="url(#vhuBookBlue)"/>

  <!-- VAN HIEN UNIVERSITY Text inside Book -->
  <text x="250" y="405" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="900" font-size="24" fill="#1C3F94" text-anchor="middle" letter-spacing="2">VAN HIEN</text>
  <text x="250" y="432" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="900" font-size="24" fill="#1C3F94" text-anchor="middle" letter-spacing="2">UNIVERSITY</text>
</svg>
